# cargo-deny configuration for documented-toml.
#
# Usage:
#   cargo install cargo-deny --locked
#   cargo deny check
#
# The license allow list encodes the license audit of the Cargo.lock
# dependency tree: every crate must be permissively licensed. Copyleft
# (AGPL/GPL/LGPL/SSPL) is not acceptable anywhere in the tree; a new
# dependency under any license not listed below fails
# `cargo deny check licenses`, so copyleft cannot enter unnoticed.

[graph]
# The crate is pure Rust with no platform-specific dependency, and is meant to
# build anywhere. The tree is license-checked on all three tiers so a future
# dependency that pulls in windows-sys or wasi is caught on arrival.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
# RustSec advisories deny vulnerabilities by default. Ignored advisories
# require an explicit entry with a reason, e.g.:
#   { id = "RUSTSEC-0000-0000", reason = "not affected: ..." }
ignore = []

[licenses]
# SPDX identifiers covering every crate in Cargo.lock as of the audit:
# - X11: documented-toml itself
# - MIT / Apache-2.0: the whole dependency tree today (nonempty, toml_edit
#   and the toml_* / winnow / indexmap crates under it)
# - the remaining identifiers are allowed ahead of need, so a small
#   permissively licensed leaf does not fail the check on arrival
allow = [
    "X11",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]
# All current dependencies carry a machine-readable SPDX `license` field, so
# this threshold only matters if a future crate ships bare LICENSE files.
confidence-threshold = 0.93

# No copyleft exception is in force. Any crate needing one gets an entry here
# with the reason it was reviewed and accepted.
exceptions = []

[bans]
multiple-versions = "warn"
highlight = "all"

# ---------------------------------------------------------------------------
# crates.io supply-chain incident, 2026-08-20
#
# Three legitimate crates had a malicious version published from a compromised
# publish path; all three were pulled by crates.io the same morning. The
# impostor crates below are denied at every version. None of them is
# legitimate, so a typosquat cannot enter the tree unnoticed either.
# Exact-pinned so a future fixed release on the same minor line still resolves.
# Mirrors ~/.config/cargo-deny/deny.toml.
# ---------------------------------------------------------------------------
deny = [
    # --- compromised versions of otherwise legitimate crates ---
    { crate = "append-only-vec:=0.1.9", reason = "malicious release, crates.io incident 2026-08-20; use 0.1.8 or a later clean release" },
    { crate = "arrayref:=0.3.10", reason = "malicious release, crates.io incident 2026-08-20; use 0.3.9 or a later clean release" },
    { crate = "internment:=0.8.7", reason = "malicious release, crates.io incident 2026-08-20; use 0.8.6 or a later clean release" },

    # --- impostor / typosquat crates: no legitimate version exists ---
    { crate = "proc-macro1", reason = "typosquat of proc-macro2, crates.io incident 2026-08-20" },
    { crate = "proc-macro-en", reason = "impostor crate, crates.io incident 2026-08-20" },
    { crate = "aovine", reason = "impostor crate, crates.io incident 2026-08-20" },
    { crate = "arone", reason = "impostor crate, crates.io incident 2026-08-20" },
    { crate = "aronenao", reason = "impostor crate, crates.io incident 2026-08-20" },
    { crate = "tinymember", reason = "impostor crate, crates.io incident 2026-08-20" },
]

[sources]
# Only crates.io is an allowed source; git or other registry dependencies
# fail until explicitly reviewed and listed here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
